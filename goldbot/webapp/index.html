<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>XAUUSD Gold</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a12; --bg2:#0c111d; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,215,120,.14); --line2:rgba(255,255,255,.08);
  --text:#f4f1e8; --muted:#8f97a8; --dim:#5d6578;
  --gold1:#fff4c9; --gold2:#f7d46b; --gold3:#e2a930; --gold4:#a66d10;
  --green:#3ee09a; --red:#ff5d73; --blue:#62a8ff;
  --gold:linear-gradient(135deg,var(--gold1) 0%,var(--gold2) 30%,var(--gold3) 65%,var(--gold4) 100%);
  --r:22px; --safe-b:env(safe-area-inset-bottom,0px);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* фон: золотые туманности и сетка */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 18s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:radial-gradient(circle,#f5b83d 0%,transparent 70%);top:-120px;right:-110px}
.orb.b{width:300px;height:300px;background:radial-gradient(circle,#7a4dff55 0%,transparent 70%);bottom:10%;left:-140px;animation-delay:-6s}
.orb.c{width:260px;height:260px;background:radial-gradient(circle,#e0a12c66 0%,transparent 70%);bottom:-120px;right:-60px;animation-delay:-12s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,40px) scale(1.12)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,215,120,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,120,.035) 1px,transparent 1px);
  background-size:36px 36px;mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%)}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 16px calc(96px + var(--safe-b))}

/* шапка */
.top{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.logo{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 1.5px #f7d46b88,0 6px 24px #f5b83d55;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:.02em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:12.5px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-weight:800;background:var(--card2);color:var(--gold2)}

/* карточки */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line2);
  border-radius:var(--r);padding:18px;margin-bottom:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.card.gold{border-color:transparent;background:
  linear-gradient(160deg,rgba(40,30,8,.92),rgba(14,12,8,.92)) padding-box,
  linear-gradient(135deg,#fff1b8,#e2a930 40%,#6b4708 70%,#f7d46b) border-box;border:1px solid transparent}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.sub{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt{margin-top:12px}.mt2{margin-top:18px}

/* герой-цена */
.hero{overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;background:radial-gradient(circle,#f7d46b30,transparent 65%);pointer-events:none}
.hello{font-size:22px;font-weight:800;margin:0 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--card2);border:1px solid var(--line2);white-space:nowrap}
.chip.ok{color:var(--green);background:#3ee09a14;border-color:#3ee09a33}
.chip.warn{color:var(--gold2);background:#f7d46b14;border-color:#f7d46b33}
.chip.bad{color:var(--red);background:#ff5d7314;border-color:#ff5d7333}
.price{font-size:40px;font-weight:700;margin:14px 0 2px;line-height:1;transition:color .6s}
.price.up{color:var(--green)}.price.down{color:var(--red)}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 #3ee09a99;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #3ee09a99}70%{box-shadow:0 0 0 10px #3ee09a00}100%{box-shadow:0 0 0 0 #3ee09a00}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:12px 10px;text-align:center;min-width:0}
.kpi b{display:block;font-size:19px;font-weight:700}
.kpi span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.pos{color:var(--green)}.neg{color:var(--red)}.goldtxt{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}

/* сигнал */
.sig{border-radius:18px;padding:14px;background:var(--card);border:1px solid var(--line2);margin-top:10px;position:relative;overflow:hidden}
.sig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.sig.buy::before{background:var(--green)}.sig.sell::before{background:var(--red)}
.side{font-weight:800;font-size:13px;padding:4px 9px;border-radius:8px;letter-spacing:.05em}
.side.buy{background:#3ee09a1f;color:var(--green)}.side.sell{background:#ff5d731f;color:var(--red)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lv div{font-size:11px;color:var(--muted);font-weight:600}
.lv b{display:block;color:var(--text);font-size:14px;margin-top:2px}
.track{position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,#ff5d7355,#ffffff14 50%,#3ee09a55);margin-top:12px}
.track i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--gold2);transform:translate(-50%,-50%);box-shadow:0 0 0 4px #f7d46b33,0 0 14px #f7d46b;transition:left .8s cubic-bezier(.2,.8,.2,1)}

/* сегменты, фильтры */
.seg{display:flex;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);transition:.25s}
.seg button.on{background:var(--gold);color:#1b1404;box-shadow:0 4px 16px #e2a93055}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line2);color:var(--muted);white-space:nowrap;transition:.2s}
.chips button.on{color:#1b1404;background:var(--gold);border-color:transparent}

/* график */
.chart{position:relative;height:190px;margin:6px -6px 0;touch-action:pan-y}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.chart .ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 4px 10px #f5b83d66)}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .ar{opacity:0;animation:fade 1s .5s forwards}@keyframes fade{to{opacity:1}}
.tip{position:absolute;top:0;transform:translateX(-50%);background:#14110a;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}

/* строки истории */
.tr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.tr:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:16px}
.ic.w{background:#3ee09a1a;color:var(--green)}.ic.l{background:#ff5d731a;color:var(--red)}.ic.o{background:#f7d46b1a;color:var(--gold2)}.ic.n{background:var(--card2);color:var(--muted)}
.tr .mid{flex:1;min-width:0}
.tr .mid b{font-size:14px;display:block}
.tr .mid span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .pp{text-align:right;font-weight:700;font-size:15px}
.tr .pp small{display:block;font-size:11px;color:var(--muted);font-weight:600;font-family:Manrope,sans-serif}

/* полосы */
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:10px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar i.g{background:linear-gradient(90deg,#1fb07a,#3ee09a)}.bar i.y{background:linear-gradient(90deg,#e2a930,#f7d46b)}.bar i.r{background:linear-gradient(90deg,#c2334b,#ff5d73)}
.bar i.gold{background:var(--gold)}
.strat{padding:10px 0;border-bottom:1px solid var(--line2)}.strat:last-child{border-bottom:0}
.strat .between span{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strat .between b{white-space:nowrap}.strat small{color:var(--muted);font-size:12px}

/* кольцо */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:28px;font-weight:800}
.ring .c em{font-style:normal;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ring circle.p{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.stat2 div{min-width:0}
.stat2 small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.stat2 b{font-size:16px}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:15px;
  background:var(--gold);color:#1b1404;box-shadow:0 8px 28px #e2a93044,inset 0 1px 0 #fff8;transition:transform .15s,filter .2s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff88,transparent);animation:shine 3.2s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line2)}
.btn.ghost::after{display:none}
.btn.red{background:#ff5d7318;color:var(--red);border:1px solid #ff5d7333;box-shadow:none}.btn.red::after{display:none}
.btn[disabled]{filter:grayscale(.6) brightness(.7)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--card2);border:1px solid var(--line2)}
.mini.g{color:#1b1404;background:var(--gold);border-color:transparent}

/* формы */
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line2);margin-top:8px;transition:.2s}
.opt b{display:block;font-size:15px}.opt span{font-size:12.5px;color:var(--muted)}
.opt.on{border-color:#f7d46b;background:#f7d46b12;box-shadow:0 0 0 3px #f7d46b22}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.toggle{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line2);margin-top:8px;width:100%;text-align:left}
.toggle .sw{width:46px;height:28px;border-radius:20px;background:#ffffff1f;position:relative;flex:none;transition:.25s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}
.toggle.on .sw{background:var(--gold3)}.toggle.on .sw::after{left:21px}
.field{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:0 14px;margin-top:8px}
.field input{flex:1;background:none;border:0;outline:0;padding:14px 0;font-size:17px;font-family:var(--mono);min-width:0}
.field:focus-within{border-color:#f7d46b88}

/* счета */
.acc{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line2);margin-top:10px}
.acc .tag{white-space:nowrap;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--card2);color:var(--muted);letter-spacing:.04em}
.acc .tag.real{color:var(--gold2);background:#f7d46b14}
.acc .tag.prop{color:#b99cff;background:#7a4dff1f}

/* нижняя навигация */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:5;width:calc(100% - 28px);max-width:520px;
  display:flex;padding:6px;border-radius:24px;background:rgba(14,16,24,.78);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:18px;color:var(--dim);font-size:11px;font-weight:700;transition:.25s;position:relative}
.nav button svg{width:22px;height:22px;transition:.25s}
.nav button.on{color:var(--gold2);background:linear-gradient(180deg,#f7d46b1c,#f7d46b08)}
.nav button.on svg{filter:drop-shadow(0 0 8px #f7d46b88);transform:translateY(-1px)}

.page{display:none;animation:in .45s cubic-bezier(.2,.8,.2,1)}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger>*{opacity:0;animation:in .5s cubic-bezier(.2,.8,.2,1) forwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.14s}
.stagger>*:nth-child(4){animation-delay:.2s}.stagger>*:nth-child(5){animation-delay:.26s}.stagger>*:nth-child(n+6){animation-delay:.32s}

/* лист снизу и тост */
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:#10131c;border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:#ffffff26;margin:0 auto 14px}
.sheet h4{margin:0 0 4px;font-size:18px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:30;padding:12px 18px;border-radius:14px;
  background:#16130a;border:1px solid var(--line);font-weight:700;font-size:14px;box-shadow:0 12px 40px #000a;transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}

/* загрузка */
.splash{position:fixed;inset:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:18px;background:var(--bg);transition:opacity .5s}
.splash.off{opacity:0;pointer-events:none}
.splash img{width:110px;height:110px;border-radius:50%;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px #f7d46b66,0 0 30px #f5b83d44}50%{box-shadow:0 0 0 2px #f7d46bcc,0 0 70px #f5b83d99}}
.splash p{margin:0;color:var(--muted);font-weight:600}
.note{font-size:12px;color:var(--dim);text-align:center;margin:18px 8px 0;line-height:1.5}
a{color:var(--gold2)}

/* обучение */
.lcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line2);margin-top:10px;transition:transform .15s,border-color .2s}
.lcard:active{transform:scale(.98)}
.lcard .ln{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--card2);border:1px solid var(--line2);position:relative}
.lcard.done .ln{background:linear-gradient(160deg,#f7d46b2e,#a66d1022);border-color:#f7d46b55}
.lcard.done .ln::after{content:"✓";position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;background:var(--gold);color:#1b1404;font-size:11px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.lcard.next{border-color:#f7d46b88;box-shadow:0 0 0 3px #f7d46b18}
.lcard .mid{flex:1;min-width:0}
.lcard .mid small{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold3)}
.lcard .mid b{display:block;font-size:15px;margin:1px 0}
.lcard .mid span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .go{color:var(--dim);font-weight:800}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lhead .back{padding:8px 12px 8px 8px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--muted);background:var(--card);border:1px solid var(--line2)}
.lhero{text-align:center;padding:24px 18px 20px}
.lhero .big{width:74px;height:74px;margin:0 auto 12px;border-radius:24px;display:grid;place-items:center;font-size:36px;background:linear-gradient(160deg,#f7d46b30,#a66d1018);border:1px solid #f7d46b55;box-shadow:0 10px 34px #f5b83d33}
.lhero h2{margin:0 0 6px;font-size:23px;font-weight:800}
.lsteps{display:flex;gap:5px;justify-content:center;margin-top:14px}
.lsteps i{width:22px;height:4px;border-radius:4px;background:#ffffff1c}
.lsteps i.on{background:var(--gold)}
.lsteps i.cur{background:var(--gold2);box-shadow:0 0 10px #f7d46b}
.lp{margin:0 0 12px;font-size:15px;line-height:1.6;color:#e6e2d6}
.lp:last-child{margin-bottom:0}
.lh{margin:18px 0 8px;font-size:16px;font-weight:800}
.lh:first-child{margin-top:0}
.ll{list-style:none;margin:0 0 12px;padding:0}
.ll:last-child{margin-bottom:0}
.ll li{position:relative;padding:7px 0 7px 22px;font-size:14.5px;line-height:1.5;color:#e6e2d6;border-bottom:1px dashed var(--line2)}
.ll li:last-child{border-bottom:0}
.ll li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px #f5b83d88}
.ll li b{color:var(--gold2)}
.callout{display:flex;gap:10px;padding:13px 14px;border-radius:16px;font-size:14px;line-height:1.5;margin:0 0 12px}
.callout:last-child{margin-bottom:0}
.callout .e{font-size:17px;line-height:1.3;flex:none}
.callout.tip{background:#f7d46b10;border:1px solid #f7d46b33;color:#f3e7c4}
.callout.warn{background:#ff5d7310;border:1px solid #ff5d7333;color:#ffd5db}
.ex{border-radius:16px;border:1px solid var(--line);overflow:hidden;margin:0 0 12px;background:#0d0f16}
.ex:last-child{margin-bottom:0}
.ex .eh{padding:10px 14px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold2);background:linear-gradient(90deg,#f7d46b1a,transparent)}
.ex .er{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);font-size:14px}
.ex .er span{color:var(--muted)}
.ex .er span{flex:1 1 45%}
.ex .er b{flex:1 1 55%;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.pl{display:grid;grid-template-columns:1.3fr 1.2fr .8fr 1fr .7fr;font-size:12.5px;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 12px;background:#0d0f16}
.pl>div{padding:9px 7px;border-top:1px solid var(--line2);text-align:center;min-width:0}
.pl>div.n{text-align:left;font-weight:800;padding-left:12px}
.pl>div.hd{border-top:0;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold2);background:#f7d46b12}
.pl .num{font-size:12.5px}
.calc .row2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.calc .row2>div{min-width:0}
.calc .field input{width:100%}
.calc .lbl{margin:12px 0 0}
.calc .res{margin-top:14px;padding:16px;border-radius:18px;text-align:center;background:linear-gradient(160deg,rgba(40,30,8,.9),rgba(14,12,8,.9));border:1px solid #f7d46b55}
.calc .res b{display:block;font-size:34px;font-weight:700;line-height:1.1}
.calc .res small{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.calc .res .w{color:var(--gold2);margin-top:6px}
.qopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line2);margin-top:8px;font-weight:700;font-size:14.5px;transition:.2s}
.qopt .k{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--card2);font-size:12px;font-weight:800;color:var(--muted)}
.qopt.ok{border-color:#3ee09a;background:#3ee09a14;box-shadow:0 0 0 3px #3ee09a1f}
.qopt.ok .k{background:var(--green);color:#04170e}
.qopt.no{border-color:#ff5d73;background:#ff5d7312;animation:shake .4s}
.qopt.no .k{background:var(--red);color:#2a0710}
.qopt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qwhy{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.qwhy.ok{background:#3ee09a12;border:1px solid #3ee09a33}
.qwhy.no{background:#ff5d7310;border:1px solid #ff5d7333}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;color:var(--green);background:#3ee09a14;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
</style>
</head>
<body>
<div class="sky"><div class="grid"></div><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="splash" id="splash"><img src="static/logo.png" alt=""><p id="splashText">…</p></div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<div class="app">
  <div class="top">
    <img class="logo" src="static/logo.png" alt="">
    <div class="brand"><b>XAUUSD GOLD</b><span id="topSub"></span></div>
    <div id="avatar"></div>
  </div>
  <section class="page on" id="p-home"></section>
  <section class="page" id="p-stats"></section>
  <section class="page" id="p-learn"></section>
  <section class="page" id="p-prop"></section>
  <section class="page" id="p-profile"></section>
</div>

<nav class="nav" id="nav">
  <button data-p="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9.5h14V10"/><path d="M10 19.5v-5h4v5"/></svg><span data-t="tab_home"></span></button>
  <button data-p="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M16 6h4v4"/></svg><span data-t="tab_stats"></span></button>
  <button data-p="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v5"/></svg><span data-t="tab_learn"></span></button>
  <button data-p="prop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span data-t="tab_prop"></span></button>
  <button data-p="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="tab_profile"></span></button>
</nav>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, T = {}, page = "home", period = 30, hFilter = "all", hShow = 25, propEdit = false, form = {};
let lastPrice = null, marketTimer = null, busy = false;
const PAGES = ["home", "stats", "learn", "prop", "profile"];
let learnDone = new Set(), lesson = null, quiz = {}, calcS = null;

function tr(k, v) { let s = T[k] ?? k; if (v) for (const [a, b] of Object.entries(v)) s = s.split("{" + a + "}").join(b); return s; }
function haptic(kind = "light") { try { if (["success","error","warning"].includes(kind)) tg.HapticFeedback.notificationOccurred(kind); else if (kind === "sel") tg.HapticFeedback.selectionChanged(); else tg.HapticFeedback.impactOccurred(kind); } catch (e) {} }
function toast(msg, kind) { const el = $("#toast"); el.textContent = msg; el.classList.add("on"); if (kind) haptic(kind); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600); }
const loc = () => ({ ru: "ru-RU", en: "en-GB", uz: "uz-Latn-UZ" }[S?.lang] || "ru-RU");
function fmtDate(iso, time = true) {
  if (!iso) return "";
  const o = { day: "2-digit", month: "2-digit", timeZone: S.tz }; if (time) { o.hour = "2-digit"; o.minute = "2-digit"; o.hour12 = false; } else o.year = "numeric";
  try { return new Date(iso).toLocaleString(loc(), o); } catch (e) { return new Date(iso).toLocaleString(); }
}
function money(x, d = 0) { if (x == null || isNaN(x)) return "—"; const s = Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/,/g, " "); return (x < 0 ? "−$" : "$") + s; }
function usd2(x) { if (x == null) return "—"; const r = Math.round(x * 100) / 100; return money(r, Number.isInteger(r) ? 0 : 2); }
function pips(x) { if (x == null) return "—"; const r = Math.round(x); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toLocaleString("en-US").replace(/,/g, " "); }
const cls = x => x > 0 ? "pos" : x < 0 ? "neg" : "";
const daysLeft = iso => Math.max(0, Math.ceil((new Date(iso) - Date.now()) / 864e5));

async function api(path, body) {
  const r = await fetch("api/" + path, { method: "POST", headers: { "Content-Type": "application/json", "X-Init-Data": tg?.initData || "" }, body: JSON.stringify(body || {}) });
  if (r.status === 401) throw new Error("auth");
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || "http " + r.status);
  return j;
}
async function call(path, body, okMsg) {
  if (busy) return null; busy = true;
  try { const j = await api(path, body); if (j.t) apply(j); if (okMsg) toast(okMsg, "success"); return j; }
  catch (e) { toast(T.error || "Error", "error"); return null; }
  finally { busy = false; }
}
function apply(j) { S = j; T = j.t; document.documentElement.lang = j.lang; renderAll(); }

/* ── навигация ── */
function go(p) {
  if (!PAGES.includes(p)) return;
  if (p === "learn" && page === "learn") lesson = null;
  page = p; haptic("sel");
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  document.querySelectorAll(".page").forEach(s => s.classList.toggle("on", s.id === "p-" + p));
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  render(p);
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.p); });

function renderAll() {
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = tr(el.dataset.t));
  const u = S.user, name = u.name || tr("trader");
  $("#avatar").innerHTML = u.photo ? `<img class="avatar" src="${esc(u.photo)}" alt="">` : `<div class="avatar">${esc(name.slice(0, 1).toUpperCase())}</div>`;
  $("#topSub").textContent = subLine();
  render(page);
}
function render(p) { ({ home: renderHome, stats: renderStats, learn: renderLearn, prop: renderProp, profile: renderProfile })[p](); syncBack(); }
function subLine() { const s = S.sub; return s.kind === "paid" ? tr("sub_paid", { date: fmtDate(s.until, false) }) : s.kind === "trial" ? tr("sub_trial", { date: fmtDate(s.until, false) }) : tr("sub_expired"); }
function subChip() {
  const s = S.sub;
  if (s.kind === "expired") return `<span class="chip bad">● ${esc(tr("sub_expired"))}</span>`;
  return `<span class="chip ${s.kind === "paid" ? "ok" : "warn"}">● ${esc(tr("days_left", { n: daysLeft(s.until) }))}</span>`;
}

/* ── расчёты статистики ── */
function periodTrades(days) { const from = days ? Date.now() - days * 864e5 : 0; return S.stats.trades.filter(x => new Date(x.ts).getTime() >= from); }
function calc(list) {
  const win = S.stats.win, closed = list.filter(x => x.status !== "open");
  const w = closed.filter(x => win.includes(x.status)), l = closed.filter(x => x.status === "sl");
  const vals = closed.filter(x => x.pips != null);
  const total = vals.reduce((a, x) => a + x.pips, 0);
  const gp = vals.filter(x => x.pips > 0).reduce((a, x) => a + x.pips, 0), gl = -vals.filter(x => x.pips < 0).reduce((a, x) => a + x.pips, 0);
  const asc = [...vals].sort((a, b) => new Date(a.closed || a.ts) - new Date(b.closed || b.ts));
  let cum = 0, peak = 0, dd = 0, run = 0, streak = 0; const pts = [];
  for (const x of asc) { cum += x.pips; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); pts.push({ v: cum, ts: x.closed || x.ts, p: x.pips });
    if (win.includes(x.status)) { run++; streak = Math.max(streak, run); } else if (x.status === "sl") run = 0; }
  return { n: list.length, open: list.length - closed.length, w: w.length, l: l.length, wr: w.length + l.length ? 100 * w.length / (w.length + l.length) : null,
    total, pf: gl > 0 ? gp / gl : gp > 0 ? Infinity : null, best: vals.length ? Math.max(...vals.map(x => x.pips)) : null,
    worst: vals.length ? Math.min(...vals.map(x => x.pips)) : null, avg: vals.length ? total / vals.length : null, dd, streak, pts };
}

/* ── SVG ── */
let uid = 0;
function ring(frac, size = 132, stroke = 11, label = "", sub = "") {
  const g = "rg" + (++uid), r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#f5c542"/><stop offset="1" stop-color="#b87910"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${stroke}"/>
    <circle class="p" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${g})" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" data-to="${c * (1 - f)}" style="filter:drop-shadow(0 0 6px #f5b83d88)"/></svg>
    <div class="c"><b class="goldtxt num">${label}</b><em>${esc(sub)}</em></div></div>`;
}
function animate(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll("circle.p[data-to]").forEach(c => c.style.strokeDashoffset = c.dataset.to);
    root.querySelectorAll(".bar i[data-w]").forEach(b => b.style.width = b.dataset.w);
    root.querySelectorAll("[data-count]").forEach(countUp);
  }));
}
function countUp(el) {
  const to = parseFloat(el.dataset.count), fmt = el.dataset.fmt || "pips", t0 = performance.now(), dur = 900;
  const f = v => fmt === "pct" ? Math.round(v) + "%" : fmt === "usd" ? usd2(v) : pips(v);
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function chart(pts, h = 190, id = "c") {
  if (pts.length < 2) return `<div class="empty">${esc(tr("no_trades"))}</div>`;
  const W = 340, vals = [0, ...pts.map(p => p.v)], min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1, pad = 14;
  const X = i => (i / (vals.length - 1)) * W, Y = v => pad + (1 - (v - min) / span) * (h - pad * 2);
  let d = ""; vals.forEach((v, i) => d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1));
  const area = d + `L${W} ${h}L0 ${h}Z`, z = Y(0), last = vals[vals.length - 1];
  return `<div class="chart" id="${id}" style="height:${h}px"><svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="gl${id}" x1="0" x2="1"><stop offset="0" stop-color="#b87910"/><stop offset=".6" stop-color="#f5c542"/><stop offset="1" stop-color="#fff1b8"/></linearGradient>
    <linearGradient id="ga${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5c542" stop-opacity=".35"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="rgba(255,255,255,.14)" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
    <path class="ar" d="${area}" fill="url(#ga${id})"/>
    <path class="ln draw" d="${d}" pathLength="1" stroke="url(#gl${id})"/>
    <line class="cur" x1="0" x2="0" y1="0" y2="${h}" stroke="#f7d46b66" stroke-width="1" vector-effect="non-scaling-stroke" style="opacity:0"/>
  </svg><div class="tip"></div><span style="position:absolute;right:2px;top:${Math.max(0, Y(last) - 26)}px;font-size:12px;font-weight:800" class="num ${cls(last)}">${pips(last)}</span></div>`;
}
function wireChart(id, pts) {
  const el = document.getElementById(id); if (!el) return;
  const tip = el.querySelector(".tip"), cur = el.querySelector(".cur"), vals = [{ v: 0, ts: null }, ...pts];
  const move = e => {
    const r = el.getBoundingClientRect(), x = Math.max(0, Math.min(r.width, (e.touches ? e.touches[0].clientX : e.clientX) - r.left));
    const i = Math.round(x / r.width * (vals.length - 1)), p = vals[i], px = i / (vals.length - 1) * r.width;
    cur.setAttribute("x1", px / r.width * 340); cur.setAttribute("x2", px / r.width * 340); cur.style.opacity = 1;
    tip.innerHTML = `<b class="num ${cls(p.v)}">${pips(p.v)}</b> ${esc(tr("pips"))}${p.ts ? " · " + esc(fmtDate(p.ts)) : ""}`;
    tip.style.left = Math.max(60, Math.min(r.width - 60, px)) + "px"; tip.classList.add("on");
    if (el._i !== i) { el._i = i; haptic("sel"); }
  };
  const end = () => { tip.classList.remove("on"); cur.style.opacity = 0; };
  el.addEventListener("pointermove", move); el.addEventListener("pointerdown", move);
  el.addEventListener("pointerleave", end); el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

/* ── главная ── */
function sigCard(s, price) {
  const buy = s.dir === 1, now = price != null ? (s.dir * (price - s.entry)) / S.pip : null;
  const lo = Math.min(s.sl, s.tp), hi = Math.max(s.sl, s.tp), pos = price != null ? Math.max(0, Math.min(1, (price - lo) / (hi - lo))) : null;
  const toTp = buy ? pos : pos != null ? 1 - pos : null; // слева стоп, справа тейк
  return `<div class="sig ${buy ? "buy" : "sell"}"><div class="between"><div class="row"><span class="side ${buy ? "buy" : "sell"}">${buy ? "BUY" : "SELL"}</span>
    <b class="num">#${s.id}</b><span class="sub">${esc(fmtDate(s.ts))}</span></div>
    ${now != null ? `<b class="num ${cls(now)}" data-live="${s.id}">${pips(now)}</b>` : ""}</div>
    <div class="lv"><div>${esc(tr("entry"))}<b class="num">${s.entry.toFixed(2)}</b></div><div>SL<b class="num neg">${s.sl.toFixed(2)}</b></div><div>TP<b class="num pos">${s.tp.toFixed(2)}</b></div></div>
    ${toTp != null ? `<div class="track"><i style="left:${(toTp * 100).toFixed(1)}%"></i></div>` : ""}
    ${s.part ? `<div class="sub mt">✓ ${esc(tr("part_done"))}</div>` : ""}</div>`;
}
function renderHome() {
  const u = S.user, m = S.market, c30 = calc(periodTrades(30)), name = u.name || tr("trader");
  let h = `<div class="stagger">
  <div class="card gold hero"><div class="between"><div><p class="hello">${esc(tr("hello", { name }))} 👋</p>${subChip()}</div></div>
    <div class="live mt2"><span class="dot"></span>${esc(tr("live"))}</div>
    <div class="price num" id="price">${m.price != null ? m.price.toFixed(2) : `<span class="sub">${esc(tr("price_wait"))}</span>`}</div></div>`;
  h += `<div class="card"><h3>📡 ${esc(tr("open_trades"))}<span class="sp"></span>${m.open.length ? `<span class="chip warn num">${m.open.length}</span>` : ""}</h3><div id="openList">
    ${m.open.length ? m.open.map(s => sigCard(s, m.price)).join("") : `<div class="sub">${esc(tr("no_open"))}</div>`}</div></div>`;
  h += `<div class="card"><h3>📈 ${esc(tr("tab_stats"))}<span class="sp"></span><span style="text-transform:none;letter-spacing:0">${esc(tr("stats_30"))}</span></h3>
    <div class="ringwrap">${ring((c30.wr ?? 0) / 100, 118, 10, c30.wr != null ? `<span data-count="${c30.wr}" data-fmt="pct">0%</span>` : "—", tr("wr"))}
    <div class="stat2"><div><small>${esc(tr("total_pips"))}</small><b class="num ${cls(c30.total)}" data-count="${c30.total}">0</b></div>
    <div><small>${esc(tr("signals"))}</small><b class="num">${c30.n}</b></div>
    <div><small>${esc(tr("wins"))}</small><b class="num pos">${c30.w}</b></div><div><small>${esc(tr("losses"))}</small><b class="num neg">${c30.l}</b></div></div></div>
    ${chart(c30.pts, 120, "homeChart")}<button class="btn ghost mt" onclick="go('stats')">${esc(tr("tab_stats"))} →</button></div>`;
  h += learnMini();
  if (S.prop) h += propMini();
  if (S.sub.kind !== "paid") h += subCard();
  h += `<p class="note">${esc(tr("app_note"))}</p></div>`;
  const el = $("#p-home"); el.innerHTML = h; wireChart("homeChart", c30.pts); animate(el);
}
function propMini() {
  const p = S.prop, f = p.progress;
  return `<div class="card" onclick="go('prop')" style="cursor:pointer"><h3>🛡 ${esc(tr("prop_title"))}<span class="sp"></span>→</h3>
    <div class="sub" style="margin:-6px 0 10px">${esc(p.plan_name)} · ${esc(p.stage_name)} · <span class="num">${money(p.size)}</span></div>
    <div class="between"><div><div class="sub">${esc(tr("balance"))}</div><b class="num" style="font-size:22px">${usd2(p.balance)}</b> <span class="num ${cls(p.profit_pct)}">${p.profit_pct >= 0 ? "+" : ""}${p.profit_pct.toFixed(2)}%</span></div>
    ${f != null ? `<div style="text-align:right"><div class="sub">${esc(tr("progress"))}</div><b class="goldtxt num" style="font-size:22px">${Math.round(f * 100)}%</b></div>` : ""}</div>
    ${f != null ? `<div class="bar"><i class="gold" data-w="${(f * 100).toFixed(1)}%"></i></div>` : ""}

  el.innerHTML = h; animate(el);
  el.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => openLesson(b.dataset.lesson));
  const r = $("#learnReset"); if (r) r.onclick = () => confirmBox(tr("learn_again_q"), ok => { if (ok) { learnDone = new Set(); saveLearn(); renderLearn(); } });
}
function block(b) {
  switch (b.t) {
    case "p": return `<p class="lp">${fill(b.x)}</p>`;
    case "h": return `<h4 class="lh">${fill(b.x)}</h4>`;
    case "list": return `<ul class="ll">${b.x.map(x => `<li>${fill(x)}</li>`).join("")}</ul>`;
    case "tip": return `<div class="callout tip"><span class="e">💡</span><div>${fill(b.x)}</div></div>`;
    case "warn": return `<div class="callout warn"><span class="e">⚠️</span><div>${fill(b.x)}</div></div>`;
    case "ex": return `<div class="ex"><div class="eh">${fill(b.h)}</div>${b.rows.map(([k, v]) => `<div class="er"><span>${fill(k)}</span><b>${fill(v)}</b></div>`).join("")}</div>`;
    case "plans": return plansTable();
    case "calc": return calcBox();
    case "go":
      if (b.to === "connect" && !S.auto.enabled) return "";
      return `<button class="btn ghost" data-goto="${esc(b.to)}">${fill(b.x)} →</button>`;
  }
  return "";
}
function plansTable() {
  const pct = v => (+v).toString().replace(".", S.lang === "en" ? "." : ",") + "%";
  let h = `<div class="pl"><div class="hd n">${esc(tr("pl_plan"))}</div><div class="hd">${esc(tr("pl_target"))}</div><div class="hd">${esc(tr("pl_daily"))}</div><div class="hd">${esc(tr("pl_total"))}</div><div class="hd">${esc(tr("pl_days"))}</div>`;
  for (const p of S.plans) {
    const tg_ = Object.values(p.targets);
    h += `<div class="n">${esc(p.name.replace(/^Stellar\s+/, ""))}</div><div class="num">${tg_.length ? tg_.map(pct).join(" + ") : "—"}</div>
      <div class="${p.daily ? "num" : "sub"}">${p.daily ? pct(p.daily) : esc(tr("pl_none"))}</div><div class="num">${pct(p.total)}${p.trailing ? " ↗" : ""}</div><div class="num">${p.min_days || "—"}</div>`;
  }
  return h + `</div><div class="sub" style="margin:-4px 0 12px;font-size:12px">${esc(tr("pl_note"))} · ↗ ${esc(tr("trailing"))}</div>`;
}
function calcBox() {
  if (!calcS) calcS = { cap: S.user.capital || 1000, risk: +S.learn.vars.risk || 1, stop: 100 };
  const R = [0.5, 1, 2];
  return `<div class="ex calc" style="padding:0 14px 14px"><div class="eh" style="margin:0 -14px">🧮 ${esc(tr("calc_title"))}</div>
    <div class="row2"><div><div class="lbl">${esc(tr("calc_capital"))}</div><div class="field"><span class="goldtxt" style="font-weight:800">$</span><input id="cCap" type="text" inputmode="decimal" value="${calcS.cap}"></div></div>
    <div><div class="lbl">${esc(tr("calc_stop"))}</div><div class="field"><input id="cStop" type="text" inputmode="decimal" value="${calcS.stop}"></div></div></div>
    <div class="lbl">${esc(tr("calc_risk"))}</div><div class="seg" id="cRisk" style="margin-top:8px">${R.map(r => `<button data-r="${r}" class="${r === calcS.risk ? "on" : ""}">${r}%</button>`).join("")}</div>
    <div class="res" id="cRes">${calcRes()}</div></div>`;
}
function calcRes() {
  const { cap, risk, stop } = calcS;
  if (!(cap > 0) || !(stop > 0)) return `<b class="num goldtxt">—</b><small>${esc(tr("bad_number"))}</small>`;
  const raw = cap * risk / 100 / (stop * 0.1), units = Math.max(1, Math.min(10000, Math.floor(raw + 1e-9))), loss = units * stop * 0.1;
  const real = loss / cap * 100;
  return `<small style="margin:0 0 4px">${esc(tr("calc_lot"))}</small><b class="num goldtxt">${(units / 100).toFixed(2)}</b>
    <small>${esc(tr("calc_loss", { loss: usd2(loss) }))}</small>${raw < 1 ? `<small class="w">${esc(tr("calc_min", { pct: +real.toFixed(1) }))}</small>` : ""}`;
}
function shuffled(id, n) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const idx = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
function quizBox(l) {
  const q = l.quiz, order = shuffled(l.id, q.a.length), pick = quiz.pick, solved = quiz.ok;
  let h = `<div class="card gold" id="quiz"><h3>🧠 ${esc(tr("quiz"))}</h3><div style="font-size:16px;font-weight:700;line-height:1.45">${fill(q.q)}</div>`;
  order.forEach((i, k) => {
    const c = solved && i === 0 ? "ok" : pick === i && i !== 0 ? "no" : "";
    h += `<button class="qopt ${c}" data-a="${i}" ${solved ? "disabled" : ""}><span class="k">${c === "ok" ? "✓" : c === "no" ? "✕" : "ABC"[k]}</span><span>${fill(q.a[i])}</span></button>`;
  });
  if (solved) h += `<div class="qwhy ok"><b>✅ ${esc(tr("quiz_ok"))}</b> ${fill(q.why)}</div>`;
  else if (pick != null) h += `<div class="qwhy no"><b>${esc(tr("quiz_no"))}.</b> ${esc(tr("quiz_retry"))}</div>`;
  if (solved || learnDone.has(l.id)) {
    const L = lessons(), i = L.findIndex(x => x.id === l.id), nx = L[i + 1];
    h += nx ? `<button class="btn mt2" data-open="${nx.id}">${esc(tr("next_lesson"))}: ${esc(nx.title)} →</button>`
            : `<button class="btn mt2" id="lFinish">🏆 ${esc(tr("finish"))}</button>`;
  }
  return h + `</div>`;
}
function lessonView(id) {
  const L = lessons(), i = L.findIndex(x => x.id === id), l = L[i];
  let h = `<div class="lhead"><button class="back" id="lBack">← ${esc(tr("back"))}</button><span class="sp" style="flex:1"></span>
    <span class="sub">${esc(tr("lesson_n", { n: i + 1 }))} · ${esc(tr("lesson_min", { n: l.min }))}</span>${learnDone.has(id) ? `<span class="badge">✓ ${esc(tr("done_badge"))}</span>` : ""}</div>
    <div class="stagger"><div class="card gold lhero"><div class="big">${l.icon}</div><h2>${esc(l.title)}</h2><div class="sub">${esc(l.sub)}</div>
    <div class="lsteps">${L.map((x, k) => `<i class="${k === i ? "cur" : learnDone.has(x.id) ? "on" : ""}"></i>`).join("")}</div></div>`;
  // блоки группируем в карточки: новая карточка начинается с подзаголовка или после калькулятора/таблицы
  let cards = [[]];
  for (const b of l.blocks) { if (b.t === "h" && cards[cards.length - 1].length) cards.push([]); cards[cards.length - 1].push(b); }
  for (const c of cards) { const inner = c.map(block).join(""); if (inner) h += `<div class="card">${inner}</div>`; }
  return h + quizBox(l) + `</div>`;
}
function confetti() {
  const box = document.createElement("div"); box.className = "confetti";
  const col = ["#fff1b8", "#f7d46b", "#e2a930", "#3ee09a", "#ffffff"];
  for (let i = 0; i < 46; i++) { const c = document.createElement("i"); c.style.left = Math.random() * 100 + "%"; c.style.background = col[i % col.length]; c.style.animationDelay = Math.random() * .5 + "s"; c.style.animationDuration = 1.2 + Math.random() * 1.1 + "s"; box.appendChild(c); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2800);
}
function wireLesson(el) {
  const l = lessons().find(x => x.id === lesson);
  $("#lBack").onclick = closeLesson;
  el.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { const to = b.dataset.goto; if (to === "connect") toChat("connect"); else go(to); });
  el.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openLesson(b.dataset.open));
  const fin = $("#lFinish"); if (fin) fin.onclick = () => { closeLesson(); if (learnDone.size === lessons().length) confetti(); };
  el.querySelectorAll(".qopt").forEach(b => b.onclick = () => {
    if (quiz.ok) return;
    const a = +b.dataset.a; quiz.pick = a;
    if (a === 0) { quiz.ok = true; const first = !learnDone.has(l.id); learnDone.add(l.id); saveLearn(); haptic("success"); if (first && learnDone.size === lessons().length) confetti(); }
    else haptic("error");
    $("#quiz").outerHTML = quizBox(l); wireLesson(el);
  });
  const cap = $("#cCap"), stop = $("#cStop"), seg = $("#cRisk");
  if (cap) {
    const upd = () => { calcS.cap = parseNum(cap.value) ?? 0; calcS.stop = parseNum(stop.value) ?? 0; $("#cRes").innerHTML = calcRes(); };
    cap.oninput = upd; stop.oninput = upd;
    seg.onclick = e => { const b = e.target.closest("button"); if (!b) return; calcS.risk = +b.dataset.r; haptic("sel"); seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); upd(); };
  }
}

/* ── профиль ── */
function subCard() {
  const s = S.sub;
  return `<div class="card gold"><h3>💎 ${esc(tr("subscription"))}<span class="sp"></span>${subChip()}</h3>
    <div class="row" style="align-items:baseline;gap:8px"><b class="num goldtxt" style="font-size:34px">${s.stars} ⭐</b><span class="sub">${esc(tr("for_days", { days: s.days }))}</span></div>
    <p class="sub">${esc(tr("sub_perks"))}</p>${s.kind !== "expired" ? `<div class="sub">${esc(subLine())}</div>` : ""}
    <button class="btn mt" onclick="pay('sub')">${esc(tr("pay_stars", { stars: s.stars }))}</button></div>`;
}
function renderProfile() {
  const u = S.user;
  let h = `<div class="stagger"><div class="card"><div class="row">${u.photo ? `<img class="avatar" style="width:56px;height:56px" src="${esc(u.photo)}" alt="">` : `<div class="avatar" style="width:56px;height:56px;font-size:22px">${esc((u.name || "T").slice(0, 1).toUpperCase())}</div>`}
    <div style="min-width:0"><b style="font-size:19px">${esc(u.name || tr("trader"))}</b><div class="sub">${esc(tr("your_id"))}: <span class="num">${u.id}</span></div></div></div></div>`;
  h += subCard();
  h += `<div class="card"><h3>💼 ${esc(tr("capital"))}</h3><div class="sub">${esc(tr("capital_hint"))}</div>
    <div class="field"><span class="goldtxt" style="font-weight:800">$</span><input id="capIn" type="text" inputmode="decimal" value="${u.capital ? u.capital : ""}" placeholder="1000"><button class="mini g" id="capSave">${esc(tr("save"))}</button></div>
    ${u.lot != null ? `<div class="kpis mt" style="grid-template-columns:1fr 2fr"><div class="kpi"><b class="num goldtxt">${u.lot.toFixed(2)}</b><span>${esc(tr("lot"))}</span></div>
      <div class="kpi"><b class="num" style="font-size:14px;padding:4px 0">${esc(tr("risk_trade", { loss: Math.round(u.lot_loss), profit: Math.round(u.lot_profit) }))}</b><span>SL / TP</span></div></div>` : ""}</div>`;
  h += `<div class="card"><h3>🌐 ${esc(tr("language"))}</h3><div class="seg" id="langSeg">${S.langs.map(l => `<button data-l="${l.code}" class="${l.code === S.lang ? "on" : ""}">${esc(l.name)}</button>`).join("")}</div></div>`;
  h += `<button class="btn ghost" onclick="tg && tg.close()">💬 ${esc(tr("open_chat"))}</button><p class="note">${esc(tr("app_note"))}</p></div>`;
  const el = $("#p-profile"); el.innerHTML = h; animate(el);
  $("#langSeg").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.l !== S.lang) call("settings", { lang: b.dataset.l }, null).then(j => j && toast(T.saved, "success")); };
  $("#capSave").onclick = () => { const v = parseNum($("#capIn").value); if (v == null || v < 0) return toast(tr("bad_number"), "error"); call("settings", { capital: v }, tr("saved")); };
}

/* ── действия ── */
function parseNum(s) { const v = parseFloat(String(s).replace(/[\s$,]/g, m => m === "," ? "." : "")); return isFinite(v) ? v : null; }
function askNumber(title, hint, val, done) {
  const sh = $("#sheet"), bg = $("#sheetBg");
  sh.innerHTML = `<div class="grab"></div><h4>${esc(title)}</h4>${hint ? `<div class="sub">${esc(hint)}</div>` : ""}
    <div class="field"><span class="goldtxt" style="font-weight:800">$</span><input id="shIn" type="text" inputmode="decimal" value="${val ?? ""}"></div>
    <div class="btns mt2"><button class="btn ghost" id="shNo">${esc(tr("cancel"))}</button><button class="btn" id="shOk">${esc(tr("ok"))}</button></div>`;
  const close = () => { sh.classList.remove("on"); bg.classList.remove("on"); document.activeElement && document.activeElement.blur(); };
  sh.classList.add("on"); bg.classList.add("on"); setTimeout(() => $("#shIn").focus(), 300);
  bg.onclick = close; $("#shNo").onclick = close;
  $("#shOk").onclick = () => { const v = parseNum($("#shIn").value); if (v == null || v < 0) return toast(tr("bad_number"), "error"); if (done(v) !== false) close(); };
}
function confirmBox(text, cb) { try { if (tg && tg.isVersionAtLeast("6.2")) return tg.showConfirm(text, cb); } catch (e) {} cb(window.confirm(text)); }
function openLink(u) { try { tg.openLink(u); } catch (e) { window.open(u, "_blank"); } }
async function pay(kind, id) {
  haptic("medium");
  const j = await call("invoice", { kind, id }); if (!j || !j.link) return;
  const after = st => { if (st === "paid") { toast(tr("paid_ok"), "success"); setTimeout(load, 2500); setTimeout(load, 7000); } else if (st === "cancelled") toast(tr("pay_cancel")); else if (st === "failed") toast(tr("error"), "error"); };
  try { tg.openInvoice(j.link, after); } catch (e) { openLink(j.link); }
}
async function toChat(what) { haptic("medium"); const j = await call("action", { do: what }); if (j) { toast(tr("goes_chat"), "success"); setTimeout(() => tg && tg.close(), 1100); } }

/* ── живая цена ── */
async function tick() {
  if (document.hidden || !S) return;
  try {
    const m = await api("market");
    const prev = S.market.price; S.market = m;
    const el = $("#price");
    if (el && m.price != null) { el.textContent = m.price.toFixed(2); if (prev != null && m.price !== prev) { el.classList.remove("up", "down"); void el.offsetWidth; el.classList.add(m.price > prev ? "up" : "down"); setTimeout(() => el.classList.remove("up", "down"), 900); } }
    const ol = $("#openList");
    if (ol) ol.innerHTML = m.open.length ? m.open.map(s => sigCard(s, m.price)).join("") : `<div class="sub">${esc(tr("no_open"))}</div>`;
  } catch (e) {}
}

async function load() {
  try { const first = !S; apply(await api("state")); if (first) { loadLearn(); render(page); } $("#splash").classList.add("off"); }
  catch (e) { $("#splashText").textContent = e.message === "auth" ? (T.auth_error || "Откройте приложение из бота в Telegram · Open the app from the bot") : "⚠️ " + (T.error || "Error"); }
}
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#070a12"); tg.setBackgroundColor("#070a12"); tg.setBottomBarColor && tg.setBottomBarColor("#070a12"); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
$("#splashText").textContent = "…";
load();
marketTimer = setInterval(tick, 8000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S) tick(); });
</script>
